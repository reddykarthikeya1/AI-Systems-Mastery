<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0056D2" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0056D2" stop-opacity="0" />
    </radialGradient>

    <!-- Top facet: AI Cognitive & Intelligence Layer -->
    <linearGradient id="topFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0056D2" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Left facet: Distributed Infrastructure & Systems Layer -->
    <linearGradient id="leftFacet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00419E" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Right facet: Bare-Metal Kernels & Hardware Layer -->
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Core Neural Glow -->
    <linearGradient id="coreLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#0056D2" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container (rounded squircle) -->
  <rect width="512" height="512" rx="128" fill="#0A0D14" />
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Isometric Hypercube / Neural Processor -->
  <g transform="translate(0, -6)">
    <!-- Top Face -->
    <path d="M 256,92 L 400,176 L 256,260 L 112,176 Z" 
          fill="url(#topFacet)" 
          stroke="#38BDF8" 
          stroke-width="3" 
          stroke-linejoin="round" />

    <!-- Left Face -->
    <path d="M 112,176 L 256,260 L 256,428 L 112,344 Z" 
          fill="url(#leftFacet)" 
          stroke="#0056D2" 
          stroke-width="3" 
          stroke-linejoin="round" />

    <!-- Right Face -->
    <path d="M 256,260 L 400,176 L 400,344 L 256,428 Z" 
          fill="url(#rightFacet)" 
          stroke="#38BDF8" 
          stroke-opacity="0.4"
          stroke-width="3" 
          stroke-linejoin="round" />

    <!-- Inner Neural Architecture Lines (Central Prism Spine) -->
    <line x1="256" y1="92" x2="256" y2="260" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="4" stroke-linecap="round" />
    <line x1="112" y1="176" x2="256" y2="260" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round" />
    <line x1="400" y1="176" x2="256" y2="260" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
    <line x1="256" y1="260" x2="256" y2="428" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />

    <!-- Neural Nodes (Vertices) -->
    <!-- Top Apex -->
    <circle cx="256" cy="92" r="10" fill="#FFFFFF" filter="url(#softGlow)" />
    <circle cx="256" cy="92" r="6" fill="#38BDF8" />

    <!-- Left Apex -->
    <circle cx="112" cy="176" r="10" fill="#38BDF8" />
    <circle cx="112" cy="176" r="5" fill="#FFFFFF" />

    <!-- Right Apex -->
    <circle cx="400" cy="176" r="10" fill="#38BDF8" />
    <circle cx="400" cy="176" r="5" fill="#FFFFFF" />

    <!-- Center Hub (Nexus Node) -->
    <circle cx="256" cy="260" r="16" fill="#0056D2" />
    <circle cx="256" cy="260" r="12" fill="#FFFFFF" filter="url(#softGlow)" />
    <circle cx="256" cy="260" r="6" fill="#0056D2" />

    <!-- Bottom Hub -->
    <circle cx="256" cy="428" r="10" fill="#38BDF8" />
    <circle cx="256" cy="428" r="5" fill="#FFFFFF" />

    <!-- Lower Left -->
    <circle cx="112" cy="344" r="8" fill="#0056D2" />
    <circle cx="112" cy="344" r="4" fill="#38BDF8" />

    <!-- Lower Right -->
    <circle cx="400" cy="344" r="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <circle cx="400" cy="344" r="4" fill="#38BDF8" />

    <!-- Dynamic Pulse Rings around Center -->
    <circle cx="256" cy="260" r="28" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 6" opacity="0.8" />
  </g>
</svg>