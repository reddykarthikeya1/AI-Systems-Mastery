<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#09090b" rx="12" />
  <path d="M 40 40 L 40 380 L 560 380" stroke="#27272a" stroke-width="1.5" fill="none" />

  <!-- Subspace W (Line) -->
  <line x1="50" y1="352" x2="530" y2="160" stroke="#52525b" stroke-width="2" stroke-dasharray="4 4" />
  <text x="490" y="152" fill="#a1a1aa" font-family="monospace" font-size="13" font-weight="bold">Subspace W = span(w)</text>

  <!-- Vector v -->
  <line x1="80" y1="340" x2="280" y2="140" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-v)" />
  <text x="270" y="124" fill="#f59e0b" font-family="monospace" font-size="14" font-weight="bold">v = [3, 4]ᵀ</text>

  <!-- Projection vector p = proj_W(v) -->
  <line x1="80" y1="340" x2="321.37931034482756" y2="243.44827586206895" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arrow)" />
  <text x="333.37931034482756" y="267.44827586206895" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">p = proj_W(v) = [4, 2]ᵀ</text>

  <!-- Orthogonal Error Vector e = v - p -->
  <line x1="321.37931034482756" y1="243.44827586206895" x2="280" y2="140" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="3 3" marker-end="url(#arrow-e)" />
  <text x="315.6896551724138" y="186.72413793103448" fill="#ef4444" font-family="monospace" font-size="13" font-weight="bold">e = v - p ⟂ W</text>

  <!-- Right Angle Indicator at p -->
  <!-- Unit perpendicular and parallel vectors -->
  <rect x="317.37931034482756" y="231.44827586206895" width="12" height="12" fill="none" stroke="#a1a1aa" stroke-width="1.5" transform="rotate(-21.8 321.37931034482756 243.44827586206895)" />

  <!-- Mathematical Invariant Callout -->
  <rect x="50" y="50" width="280" height="70" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="65" y="75" fill="#e4e4e7" font-family="monospace" font-size="12" font-weight="bold">Orthogonality Invariant:</text>
  <text x="65" y="95" fill="#38bdf8" font-family="monospace" font-size="12">⟨e, w⟩ = ⟨v - p, w⟩ = 0</text>
  <text x="65" y="112" fill="#a1a1aa" font-family="monospace" font-size="11">Minimal reconstruction error ‖v - p‖₂</text>
</svg>