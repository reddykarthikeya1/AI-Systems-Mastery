<!doctype html><html><head>
<meta charset="utf-8"><title>API Driven</title>
<style>body{font:14px system-ui;margin:2rem}table{border-collapse:collapse}
td,th{border:1px solid #ccc;padding:.4rem .7rem}
.product-card{border:1px solid #ddd;padding:.6rem;margin:.4rem 0}</style></head><body>
<h1>API-Driven Catalogue</h1>
<p id="out">fetching&hellip;</p>
<script>
// The page renders itself from JSON. Intercepting this response is cheaper and
// far more stable than parsing whatever DOM it happens to produce.
fetch('api_products.json')
  .then(r => r.json())
  .then(d => {
     document.getElementById('out').textContent = d.products.length + ' products via API';
  });
</script></body></html>
