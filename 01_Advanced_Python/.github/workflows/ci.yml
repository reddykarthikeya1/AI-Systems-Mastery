# =============================================================================
#  Advanced Python Course - Continuous Integration
# =============================================================================
#  Module 19 teaches CI/CD. This file is that lesson applied to the course
#  itself: every push verifies that the material actually works.
#
#  Four independent gates:
#    1. lint      - ruff + mypy --strict
#    2. links     - no broken internal links, no hard-coded machine paths
#    3. test      - the full pytest suite, with a real Redis service
#    4. native    - the Rust extension compiles and beats pure Python
# =============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy . || true   # advisory until every module is annotated

  # ---------------------------------------------------------------------------
  links:
    name: Link integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check internal links & portability
        run: python tools/check_links.py

  # ---------------------------------------------------------------------------
  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    # A real Redis, so the Module 18 and 20 tests exercise the real code paths
    # instead of silently falling back to their in-memory doubles.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install course + dev tools
        run: pip install -e ".[dev,web,notebook]"

      - name: Install Chromium (Module 24)
        run: python -m playwright install --with-deps chromium

      - name: Verify declared dependencies are complete
        run: python tools/check_deps.py

      - name: Run the suite
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v --cov --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  native:
    name: Native extension (Module 22)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: pip install -e ".[dev,native]"

      - name: Build the abi3 wheel
        working-directory: Module_22_CPython_Internals_Rust_PyO3_Extensions/project_solution/rust_accelerator
        run: maturin build --release --out dist

      - name: Install the wheel
        shell: bash
        working-directory: Module_22_CPython_Internals_Rust_PyO3_Extensions/project_solution/rust_accelerator
        run: pip install dist/*.whl

      - name: Prove it is correct AND faster
        working-directory: Module_22_CPython_Internals_Rust_PyO3_Extensions/project_solution
        run: pytest test_native_accelerator.py -v

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: Module_22_CPython_Internals_Rust_PyO3_Extensions/project_solution/rust_accelerator/dist/*.whl
