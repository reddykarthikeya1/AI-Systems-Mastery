[package]
name = "rust_accelerator"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_accelerator"     # MUST match the #[pymodule] fn name in src/lib.rs
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py311"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
