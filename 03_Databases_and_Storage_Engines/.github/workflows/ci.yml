# =============================================================================
#  Databases Mastery Course - Continuous Integration
# =============================================================================
#  Verifies that every module, internal engine model, real database driver,
#  and live operational script executes cleanly against real services.
#
#  Gates:
#    1. lint     - ruff
#    2. links    - check_links.py (zero broken, zero absolute paths)
#    3. deps     - check_deps.py (all imports declared in pyproject.toml)
#    4. test     - pytest suite with Postgres, MySQL, Mongo, Redis, Elastic, Qdrant
#    5. heavy    - nightly job for Cassandra and Oracle
# =============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .

  links:
    name: Link Integrity & Portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check internal links & portability
        run: python tools/check_links.py

  deps:
    name: Dependency Declaration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,relational,nosql,analytics,vector,oracle]"
      - name: Verify dependencies
        run: python tools/check_deps.py

  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: coursepw
          POSTGRES_DB: coursedb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: coursepw
          MYSQL_DATABASE: coursedb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root --password=coursepw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      mongo:
        image: mongo:7
        ports:
          - 27017:27017

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,relational,nosql,analytics,vector]"
      - name: Run Pytest Suite
        run: pytest -q

  heavy_engines:
    name: Nightly Heavy Engines (Cassandra & Oracle)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev,relational,nosql,analytics,vector,oracle]"
      - name: Start Cassandra and Oracle
        run: |
          docker run -d --name cassandra -p 9042:9042 cassandra:5
          docker run -d --name oracle -p 1521:1521 -e ORACLE_PASSWORD=coursepw gvenzl/oracle-free:slim
      - name: Run Pytest Heavy Marks
        run: pytest -m "requires_cassandra or requires_oracle" -q
