[project]
name = "11-autonomous-agents-and-cognitive-architectures"
version = "1.0.0"
description = "11. Autonomous Agentic Architectures & Cognitive Systems"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0"
]


[project.optional-dependencies]
# Used only by tools/check_notebooks.py, not by the course material.
notebook = [
    "nbclient>=0.9",
    "nbformat>=5.9",
]

[tool.pytest.ini_options]
testpaths = ["."]
