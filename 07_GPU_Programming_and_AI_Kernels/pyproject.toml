[project]
name = "07-gpu-programming-and-ai-kernels"
version = "1.0.0"
description = "07. GPU Programming & AI Kernel Engineering (CUDA & Triton)"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0"
,
    "numpy>=1.26",
]


[project.optional-dependencies]
# Used only by tools/check_notebooks.py, not by the course material.
notebook = [
    "nbclient>=0.9",
    "nbformat>=5.9",
]

[tool.pytest.ini_options]
testpaths = ["."]
