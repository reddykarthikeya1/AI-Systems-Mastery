[project]
name = "ai-research-archive"
version = "0.1.0"
description = "A structured path from math fundamentals to building and operating LLMs"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "ruff>=0.4",
]
notebook = [
    "nbclient>=0.9",
    "nbformat>=5.9",
    "ipykernel>=6.29",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
timeout = 300
markers = [
    "perf: asserts a performance property rather than a correctness one",
]
# norecursedirs REPLACES pytest's defaults rather than extending them, so the
# defaults have to be restated here or they are silently lost.
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    "starter", "debug_lab",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/starter/*.py" = ["ARG", "B", "SIM"]
"**/debug_lab/*.py" = ["ALL"]
