[project]
name = "12-llm-evaluation-science-and-guardrails"
version = "1.0.0"
description = "12. LLM Evaluation Science, Guardrails & AI Safety Operations"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0"
]


[project.optional-dependencies]
# Used only by tools/check_notebooks.py, not by the course material.
notebook = [
    "nbclient>=0.9",
    "nbformat>=5.9",
]

[tool.pytest.ini_options]
testpaths = ["."]
