# High-Level Design (HLD) Python Labs - Educational Infrastructure
# Provisions local instances of Redis, PostgreSQL, and Kafka for hands-on systems design labs.
version: '3.8'

services:
  # ============================================================================
  # 1. REDIS: In-Memory Key-Value Store & Distributed Coordination
  # Educational Roles:
  #   - Chapter 03 (Caching): Versioned Cache-Aside & Atomic Stale-Fill Rejection (Lua)
  #   - Chapter 15 (Rate Limiting): Dual Token Bucket (RPM + TPM) with server-side TIME
  #   - Workshop E-Commerce: Flash Sale High-Throughput Write-Ahead Inventory Reservation
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: hld_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 2. POSTGRESQL: Authoritative ACID Relational Ledger & Outbox
  # Educational Roles:
  #   - Chapter 12 (Event-Driven): Transactional Outbox with 'FOR UPDATE SKIP LOCKED'
  #   - Chapter 24 (Authorization): Zanzibar ReBAC relational tuple storage
  #   - Workshop E-Commerce: Durable, authoritative financial and inventory ledger
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hld_postgres
    environment:
      POSTGRES_USER: hld_user
      POSTGRES_PASSWORD: hld_password
      POSTGRES_DB: hld_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hld_user -d hld_database"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 3. KAFKA & ZOOKEEPER: Distributed Event Streaming & Outbox Message Broker
  # Educational Roles:
  #   - Chapter 12 (Event-Driven): High-throughput append-only message log for
  #     asynchronous Transactional Outbox publishing and Idempotent Consumer Inboxes
  #   - Chapter 18 (Sagas): Distributed choreography/orchestration event backbone
  # ============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: hld_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: hld_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  redis_data:
  postgres_data:

